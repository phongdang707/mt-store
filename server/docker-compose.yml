# API and the Next.js shop. MongoDB is Atlas via MONGODB_URI in .env.
# Public HTTPS is the existing nhatro nginx on nhatro_edge, not this file.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod
    image: mt-store-api:latest
    container_name: mt-store-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    volumes:
      - uploads:/app/uploads
    networks:
      edge:
        aliases:
          - mt-store-api
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>r.json()).then((b)=>process.exit(b.mongo==='up'?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://mt-store.nhatrothongminh.click}
    image: mt-store-web:latest
    container_name: mt-store-web
    restart: unless-stopped
    environment:
      PORT: 3001
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      edge:
        aliases:
          - mt-store-web
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

networks:
  edge:
    external: true
    name: nhatro_edge

volumes:
  uploads:

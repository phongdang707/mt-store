server {
  listen 80;
  server_name mt-store.nhatrothongminh.click;

  client_max_body_size 10m;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://mt-store.store$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name mt-store.nhatrothongminh.click;

  client_max_body_size 10m;

  ssl_certificate /etc/letsencrypt/live/mt-store.nhatrothongminh.click/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/mt-store.nhatrothongminh.click/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  location / {
    return 301 https://mt-store.store$request_uri;
  }
}
